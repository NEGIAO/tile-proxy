[project]
name = "tile-proxy"
version = "1.0.0"
description = "Standalone map tile passthrough proxy and GCJ-02/BD-09 rectification (FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "pillow>=11.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
